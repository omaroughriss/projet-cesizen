# docker-compose.yml
version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: 
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: 
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  postgres_data: