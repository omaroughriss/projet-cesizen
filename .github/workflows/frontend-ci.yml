name: Frontend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './front-end/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application for testing
        run: |
          npm run preview -- --host 0.0.0.0 &
          npx wait-on http://localhost:4173

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        continue-on-error: true
        id: cypress
        with:
          working-directory: front-end
          browser: chrome
          wait-on: 'http://localhost:4173'
          config: baseUrl=http://localhost:4173

      - name: Check if any test passed
        if: always()
        run: |
          if [[ "${{ steps.cypress.outcome }}" == "success" ]] || [[ -f cypress/results/results.json && $(jq '.stats.passes' cypress/results/results.json) -gt 0 ]]; then
            echo "Au moins un test a réussi"
            exit 0
          else
            echo "Aucun test n'a réussi"
            exit 1
          fi

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/front-end:latest
            ghcr.io/${{ github.repository }}/front-end:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 